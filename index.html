<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning · Transição (Supabase)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--brand:#003C23;--brand-800:#00301C;--brand-600:#0B5C3A;--emerald:#0FA968;--mint:#3ED494;--mint-soft:#DCF3E7;
--paper:#F4F8F5;--card:#FFFFFF;--ink:#12211A;--muted:#5B6B62;--line:#DCE6E0;
--display:'Space Grotesk',sans-serif;--body:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;--amber:#B8860B;--red:#C0392B}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--paper);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:var(--body)}.hidden{display:none!important}
.gate{position:fixed;inset:0;background:var(--brand);display:flex;align-items:center;justify-content:center;z-index:100;overflow:hidden;padding:16px}
.gate::after{content:"";position:absolute;right:-160px;top:-160px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(62,212,148,.18),transparent 62%)}
.box{position:relative;z-index:2;background:var(--card);border-radius:20px;padding:34px 34px;width:min(410px,94vw);box-shadow:0 30px 70px rgba(0,0,0,.35)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo svg{width:38px;height:38px;color:var(--emerald)}.logo b{font-family:var(--display);font-weight:700;font-size:25px;color:var(--brand)}
.box h2{font-family:var(--display);margin:0 0 4px;color:var(--brand);font-size:19px}
.box p{margin:0 0 16px;color:var(--muted);font-size:13px}
label{display:block;font-size:12px;font-weight:600;color:var(--brand);margin:14px 0 6px;font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase}
select,input,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-family:var(--body);font-size:14px;color:var(--ink);background:#fff}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--emerald);box-shadow:0 0 0 3px rgba(15,169,104,.12)}
input[type=file]{padding:8px}
.err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px}
.ok{color:var(--emerald)}
.btn{font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--brand);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--emerald);color:var(--emerald)}
.btn.solid{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.solid:hover{background:var(--brand-600)}
.btn.emerald{background:var(--emerald);color:#fff;border-color:var(--emerald)}.btn.emerald:hover{background:#0c8f58}
.btn.sm{padding:6px 11px;font-size:12px}.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--red)}.btn.danger:hover{border-color:var(--red)}
.btn.full{width:100%;justify-content:center;margin-top:18px}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
#app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--brand);color:#CFE8DC;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side-logo{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px}
.side-logo svg{width:26px;height:26px;color:var(--mint)}.side-logo b{font-family:var(--display);font-size:19px;color:#fff}
.nav-group{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mint);padding:14px 10px 6px;opacity:.85}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:#CFE8DC;text-decoration:none;font-size:13.5px;cursor:pointer;margin-bottom:2px}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}.nav a.active{background:var(--emerald);color:#fff}
.nav a svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2}
.nav a .mini{margin-left:auto;font-size:10.5px;font-family:var(--mono);opacity:.75}
main{min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 26px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.topbar h1{font-family:var(--display);font-size:18px;color:var(--brand);margin:0}.topbar .sub{font-size:12px;color:var(--muted)}
.spacer{flex:1}.userchip{display:flex;align-items:center;gap:9px;font-size:13px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--mint-soft);color:var(--emerald);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--display);font-size:13px}
.role-badge{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:100px;background:var(--mint-soft);color:var(--brand-600)}
.content{padding:24px 26px 60px;max-width:1080px}
.pbar{display:flex;align-items:center;gap:14px;margin-bottom:22px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.pbar .big{font-family:var(--display);font-size:30px;font-weight:700;color:var(--brand);line-height:1}
.pb-track{flex:1;height:10px;background:#E1EAE5;border-radius:100px;overflow:hidden}
.pb-fill{height:100%;width:0;background:linear-gradient(90deg,var(--emerald),var(--mint));transition:width .35s}
.pb-txt{font-family:var(--mono);font-size:12.5px;color:var(--brand);font-weight:600}
.grid{display:grid;gap:14px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:28px;font-weight:700;color:var(--brand);margin-top:4px}
.mod-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;transition:.15s}
.mod-card:hover{border-color:var(--emerald);box-shadow:0 6px 18px rgba(0,0,0,.05)}
.mod-card .name{font-family:var(--display);font-weight:600;color:var(--brand);font-size:15px;display:flex;align-items:center;gap:9px}
.mod-card .name svg{width:17px;height:17px;stroke:var(--emerald);fill:none;stroke-width:2}
.mod-card .cnt{font-size:12px;color:var(--muted);margin:8px 0 8px}
.mini-track{height:6px;background:#E1EAE5;border-radius:100px;overflow:hidden}.mini-track span{display:block;height:100%;background:var(--emerald)}
.sh{margin-bottom:16px}.sh h2{font-family:var(--display);font-size:22px;color:var(--brand);margin:0 0 3px}.sh p{margin:0;color:var(--muted);font-size:13.5px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px}
.item{border:1px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden;background:#fff}
.item-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.status-dot{width:11px;height:11px;border-radius:50%;flex:none;background:#C4D3CB}
.status-dot.em_andamento{background:var(--amber)}.status-dot.concluido{background:var(--emerald)}.status-dot.na{background:#9AA8A1}
.item-head .txt{flex:1;font-size:14px}
.badge{font-size:11px;font-family:var(--mono);padding:3px 9px;border-radius:100px;white-space:nowrap}
.badge.pendente{background:#EFEFEA;color:#6B6B5A}.badge.em_andamento{background:#FBF1D8;color:var(--amber)}
.badge.concluido{background:var(--mint-soft);color:var(--brand-600)}.badge.na{background:#EAEDEB;color:#7A857F}
.item-head .att{font-size:11px;color:var(--muted)}
.chev{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;transition:.2s}.item.open .chev{transform:rotate(180deg)}
.item-body{display:none;padding:4px 16px 16px;border-top:1px dashed var(--line);background:#FBFDFC}.item.open .item-body{display:block}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.att-list{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.att-row{display:flex;align-items:center;gap:8px;font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.att-row a{color:var(--emerald);text-decoration:none;font-weight:600;cursor:pointer}.att-row .rm{margin-left:auto;color:var(--red);cursor:pointer;font-size:11px}
.saveinfo{font-size:11.5px;color:var(--muted);margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}th{font-family:var(--display);font-size:12px;color:var(--brand)}tr:last-child td{border-bottom:0}
.tag{font-size:11px;background:#EAF4EE;border:1px solid #D3E7DC;color:var(--brand-600);padding:3px 9px;border-radius:7px;display:inline-block;margin:2px 3px 2px 0;cursor:pointer;user-select:none}
.tag.off{background:#F1F3F2;color:#9AA8A1;border-color:#E4E9E6}
.form-inline{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end;margin-bottom:16px}.form-inline label{margin:0 0 5px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.warn{background:#FBF1D8;border:1px solid #EBD9A0;color:#7A5C0A;border-radius:10px;padding:12px 14px;font-size:12.5px;margin-bottom:16px;display:flex;gap:9px}
.warn svg{width:16px;height:16px;flex:none;stroke:var(--amber);fill:none;stroke-width:2;margin-top:1px}
.empty{color:var(--muted);font-size:13px;padding:14px 0}
.loading{position:fixed;inset:0;background:rgba(244,248,245,.7);display:flex;align-items:center;justify-content:center;z-index:60;font-family:var(--mono);color:var(--brand);font-size:13px}
@media(max-width:820px){#app{grid-template-columns:1fr}aside{position:static;height:auto}.frow,.g3,.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="spark" viewBox="0 0 24 24">
<g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
<line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
<line x1="4.9" y1="4.9" x2="7.8" y2="7.8"/><line x1="16.2" y1="16.2" x2="19.1" y2="19.1"/><line x1="19.1" y1="4.9" x2="16.2" y2="7.8"/><line x1="7.8" y1="16.2" x2="4.9" y2="19.1"/>
</g></symbol></svg>

<!-- LOGIN -->
<div id="gateLogin" class="gate hidden"><div class="box">
  <div class="logo"><svg><use href="#spark"/></svg><b>Planning</b></div>
  <div class="tabs"><button id="tabIn" class="on" onclick="authTab('in')">Entrar</button><button id="tabUp" onclick="authTab('up')">Criar conta</button></div>
  <div id="upName" class="hidden"><label>Nome</label><input id="auName" placeholder="Seu nome"></div>
  <label>E-mail</label><input id="auEmail" type="email" placeholder="voce@empresa.com" onkeydown="if(event.key==='Enter')doAuth()">
  <label>Senha</label><input id="auPass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doAuth()">
  <div class="err" id="auErr"></div>
  <button class="btn solid full" id="auBtn" onclick="doAuth()">Entrar</button>
  <div class="hint" style="margin-top:12px">Novos usuários entram como <b>membro</b>. Um administrador define o perfil e libera os módulos.</div>
</div></div>

<!-- APP -->
<div id="app" class="hidden">
  <aside><div class="side-logo"><svg><use href="#spark"/></svg><b>Planning</b></div><div class="nav" id="nav"></div></aside>
  <main>
    <div class="topbar">
      <div><h1 id="pgTitle">Painel</h1><div class="sub" id="pgSub"></div></div>
      <div class="spacer"></div>
      <div class="userchip"><div class="avatar" id="uAv">?</div>
        <div><div id="uName" style="font-weight:600"></div><span class="role-badge" id="uRole"></span></div>
        <button class="btn sm ghost" onclick="logout()">Sair</button></div>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>
<div id="loading" class="loading hidden">carregando…</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const ICON={conta:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M9 13h6 M9 17h6',fiscal:'M9 3v18 M15 3v18 M4 8h16 M4 16h16',dp:'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 7a4 4 0 1 0 0 .01 M23 21v-2a4 4 0 0 0-3-3.87',tes:'M12 1v22 M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6',ctrl:'M3 3v18h18 M7 14l4-4 3 3 5-6',patr:'M3 21h18 M5 21V8l7-5 7 5v13 M9 21v-6h6v6',est:'M21 8V21H3V8 M1 3h22v5H1z M10 12h4',obr:'M9 11l3 3L22 4 M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11',aud:'M11 3a8 8 0 1 0 0 16 8 8 0 0 0 0-16z M21 21l-4.3-4.3',comp:'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z',ti:'M4 4h16v12H4z M2 20h20 M9 16v4 M15 16v4',erp:'M4 4h16v16H4z M4 9h16 M9 4v16',kpi:'M18 20V10 M12 20V4 M6 20v-6',team:'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 7a4 4 0 1 0 0 .01 M23 21v-2a4 4 0 0 0-3-3.87',gov:'M3 21h18 M12 3l9 6H3z M6 9v9 M18 9v9',plan:'M12 20V10 M18 20V4 M6 20v-4 M2 20h20'};
const STATUS=[['pendente','Pendente'],['em_andamento','Em andamento'],['concluido','Concluído'],['na','Não aplicável']];
const $=id=>document.getElementById(id);
const load=on=>$('loading').classList.toggle('hidden',!on);
function p(d){return d.split(' M').map((s,i)=>`<path d="${i?'M'+s:s}"/>`).join('');}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

let sb=null, ST={}, route={view:'dash',mod:null}, authMode='in';

/* ---------- auth ---------- */
window.authTab=function(m){authMode=m;$('tabIn').classList.toggle('on',m==='in');$('tabUp').classList.toggle('on',m==='up');
  $('upName').classList.toggle('hidden',m!=='up');$('auBtn').textContent=m==='up'?'Criar conta':'Entrar';$('auErr').textContent='';};
window.doAuth=async function(){const email=$('auEmail').value.trim(),pass=$('auPass').value;$('auErr').textContent='';
  if(!email||!pass){$('auErr').textContent='Informe e-mail e senha.';return;}load(true);
  try{
    if(authMode==='up'){const{error}=await sb.auth.signUp({email,password:pass,options:{data:{nome:$('auName').value.trim()||email}}});
      if(error)throw error;$('auErr').innerHTML='<span class="ok">Conta criada. Se a confirmação por e-mail estiver ativa, confirme antes de entrar.</span>';authTab('in');}
    else{const{error}=await sb.auth.signInWithPassword({email,password:pass});if(error)throw error;await enter();}
  }catch(e){$('auErr').textContent=e.message||'Falha na autenticação.';}finally{load(false);}};
window.logout=async function(){await sb.auth.signOut();ST={};$('app').classList.add('hidden');$('gateLogin').classList.remove('hidden');};

/* ---------- boot ---------- */
async function boot(){
  // Puxa as variáveis configuradas na Vercel
  const url = process.env.VITE_SUPABASE_URL || localStorage.getItem('sb_url');
  const key = process.env.VITE_SUPABASE_ANON_KEY || localStorage.getItem('sb_key');

  if(!url || !key){
    alert('Variáveis de ambiente do Supabase não foram encontradas no Vercel.');
    return;
  }
  
  sb = createClient(url, key);
  const{data:{session}} = await sb.auth.getSession();
  if(session){ await enter(); } else { $('gateLogin').classList.remove('hidden'); }
}
window.boot=boot;

async function enter(){
  load(true);
  try{
    const{data:{user}}=await sb.auth.getUser();
    let{data:prof}=await sb.from('profiles').select('*').eq('id',user.id).single();
    if(!prof){await sb.from('profiles').insert({id:user.id,nome:user.email,email:user.email});prof={id:user.id,nome:user.email,role:'membro'};}
    ST.profile=prof;
    await loadAll();
    $('gateLogin').classList.add('hidden');$('app').classList.remove('hidden');
    $('uName').textContent=prof.nome||user.email;$('uRole').textContent=roleName(prof.role);$('uAv').textContent=(prof.nome||user.email||'?')[0].toUpperCase();
    route={view:'dash',mod:null};renderNav();render();
  }catch(e){alert('Erro ao carregar: '+(e.message||e));}finally{load(false);}
}
function roleName(r){return r==='admin'?'Administrador':r==='gestor'?'Gestor':r==='diretoria'?'Diretoria':'Membro';}
function isAdmin(){return ['admin','gestor'].includes(ST.profile.role);}
function canWrite(){return ST.profile.role!=='diretoria';}

async function loadAll(){
  const[mods,items,status,eq,dir,cart,ges,anx]=await Promise.all([
    sb.from('modulo').select('*').order('ordem'),
    sb.from('item').select('*').order('ordem'),
    sb.from('item_status').select('*'),
    sb.from('equipe').select('*').order('nome'),
    sb.from('diretoria').select('*').order('nome'),
    sb.from('carteira').select('*').order('nome'),
    sb.from('gestor').select('*'),
    sb.from('anexo').select('*')
  ]);
  ST.modules=mods.data||[];
  ST.items={};(items.data||[]).forEach(it=>{(ST.items[it.modulo_key]=ST.items[it.modulo_key]||[]).push(it);});
  ST.status={};(status.data||[]).forEach(s=>ST.status[s.item_id]=s);
  ST.equipe=eq.data||[];ST.diretoria=dir.data||[];ST.carteiras=cart.data||[];
  ST.gestores={};(ges.data||[]).forEach(g=>ST.gestores[g.tipo]=g);
  ST.anexos={};(anx.data||[]).forEach(a=>{(ST.anexos[a.item_id]=ST.anexos[a.item_id]||[]).push(a);});
  // módulos visíveis
  if(ST.profile.role==='membro'){
    const{data}=await sb.from('acesso_modulo').select('modulo_key').eq('profile_id',ST.profile.id);
    ST.access=(data||[]).map(x=>x.modulo_key);
  }else ST.access='all';
}
function canModule(k){return ST.access==='all'||ST.access.includes(k);}
function visibleModules(){return ST.modules.filter(m=>canModule(m.key));}

/* ---------- nav ---------- */
function renderNav(){
  let h=`<div class="nav-group">Geral</div><a data-v="dash" onclick="go('dash')"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>Painel</a><div class="nav-group">Módulos</div>`;
  h+=visibleModules().map(m=>{const s=modStats(m.key);return `<a data-v="mod-${m.key}" onclick="go('mod','${m.key}')"><svg viewBox="0 0 24 24">${p(ICON[m.key]||'')}</svg>${esc(m.nome)}<span class="mini">${s.ok}/${s.tot}</span></a>`;}).join('');
  if(isAdmin()){h+=`<div class="nav-group">Cadastros</div>
    <a data-v="diretoria" onclick="go('diretoria')"><svg viewBox="0 0 24 24"><path d="M12 3l9 6H3z"/><path d="M6 9v9 M18 9v9 M3 21h18"/></svg>Diretoria</a>
    <a data-v="equipe" onclick="go('equipe')"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><path d="M9 7a4 4 0 1 0 0 .01"/></svg>Equipe</a>
    <a data-v="gestores" onclick="go('gestores')"><svg viewBox="0 0 24 24"><path d="M16 11l2 2 4-4"/><path d="M15 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/></svg>Gestores</a>
    <a data-v="carteiras" onclick="go('carteiras')"><svg viewBox="0 0 24 24"><path d="M20 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>Carteiras</a>
    <div class="nav-group">Administração</div>
    <a data-v="usuarios" onclick="go('usuarios')"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Usuários e acessos</a>`;}
  $('nav').innerHTML=h;highlight();
}
function highlight(){document.querySelectorAll('#nav a').forEach(a=>a.classList.remove('active'));
  const k=route.view==='mod'?'mod-'+route.mod:route.view;const el=document.querySelector(`#nav a[data-v="${k}"]`);if(el)el.classList.add('active');}
window.go=function(v,mod){if(v==='mod'&&!canModule(mod))return;route={view:v,mod:mod||null};highlight();render();};

/* ---------- stats ---------- */
function modStats(k){const items=ST.items[k]||[];let ok=0,and=0;items.forEach(it=>{const s=(ST.status[it.id]||{}).status;if(s==='concluido')ok++;if(s==='em_andamento')and++;});return{tot:items.length,ok,and};}
function globalStats(){let tot=0,ok=0,and=0,pend=0;ST.modules.forEach(m=>{(ST.items[m.key]||[]).forEach(it=>{tot++;const s=(ST.status[it.id]||{}).status;if(s==='concluido')ok++;else if(s==='em_andamento')and++;else pend++;});});return{tot,ok,and,pend};}

/* ---------- render ---------- */
function setTitle(t,s){$('pgTitle').textContent=t;$('pgSub').textContent=s||'';}
function render(){const v=route.view,b=$('view');
  if(v==='dash')return dash(b);
  if(v==='mod')return modView(b,route.mod);
  if(v==='diretoria')return people(b,'diretoria');
  if(v==='equipe')return people(b,'equipe');
  if(v==='gestores')return gestores(b);
  if(v==='carteiras')return carteiras(b);
  if(v==='usuarios')return users(b);
}
function dash(b){setTitle('Painel da transição','Visão geral do progresso');const g=globalStats(),pct=g.tot?Math.round(g.ok/g.tot*100):0;const mods=visibleModules();
  b.innerHTML=`<div class="pbar"><div class="big">${pct}%</div><div style="flex:1"><div style="font-weight:600;margin-bottom:6px">Conclusão geral</div><div class="pb-track"><div class="pb-fill" style="width:${pct}%"></div></div></div><div class="pb-txt">${g.ok}/${g.tot} itens</div></div>
   <div class="grid g3" style="margin-bottom:22px">
     <div class="stat"><div class="k">Concluídos</div><div class="v" style="color:var(--emerald)">${g.ok}</div></div>
     <div class="stat"><div class="k">Em andamento</div><div class="v" style="color:var(--amber)">${g.and}</div></div>
     <div class="stat"><div class="k">Pendentes</div><div class="v">${g.pend}</div></div></div>
   <div class="sh"><h2>Módulos</h2><p>Acesso a ${mods.length} de ${ST.modules.length} módulos.</p></div>
   <div class="grid g3">${mods.map(m=>{const s=modStats(m.key),pc=s.tot?Math.round(s.ok/s.tot*100):0;
     return `<div class="mod-card" onclick="go('mod','${m.key}')"><div class="name"><svg viewBox="0 0 24 24">${p(ICON[m.key]||'')}</svg>${esc(m.nome)}</div><div class="cnt">${s.ok}/${s.tot} concluídos · ${pc}%</div><div class="mini-track"><span style="width:${pc}%"></span></div></div>`;}).join('')}</div>`;}

function modView(b,k){const m=ST.modules.find(x=>x.key===k);setTitle(m.nome,'Status, responsável, observação e anexos');const items=ST.items[k]||[],s=modStats(k),pct=s.tot?Math.round(s.ok/s.tot*100):0,ro=!canWrite();
  b.innerHTML=`<div class="pbar"><div class="big">${pct}%</div><div style="flex:1"><div style="font-weight:600;margin-bottom:6px">${esc(m.nome)}</div><div class="pb-track"><div class="pb-fill" style="width:${pct}%"></div></div></div><div class="pb-txt">${s.ok}/${s.tot}</div></div>
   ${ro?'<div class="warn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4 M12 16h.01"/></svg>Perfil Diretoria: somente leitura.</div>':''}
   ${items.map(it=>itemHTML(it,ro)).join('')}`;}
function itemHTML(it,ro){const st=ST.status[it.id]||{status:'pendente'};const label=(STATUS.find(x=>x[0]===st.status)||STATUS[0])[1];const att=ST.anexos[it.id]||[];const iid=it.id.replace('.','_');
  return `<div class="item" id="it_${iid}"><div class="item-head" onclick="tog('${it.id}')">
    <span class="status-dot ${st.status}"></span><span class="txt">${esc(it.descricao)}</span>
    ${att.length?`<span class="att">📎 ${att.length}</span>`:''}${st.obs?'<span class="att">📝</span>':''}
    <span class="badge ${st.status}">${label}</span><svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
    <div class="item-body">
      <div class="frow">
        <div><label>Status</label><select ${ro?'disabled':''} onchange="setField('${it.id}','status',this.value)">${STATUS.map(s=>`<option value="${s[0]}" ${st.status===s[0]?'selected':''}>${s[1]}</option>`).join('')}</select></div>
        <div><label>Responsável</label><select ${ro?'disabled':''} onchange="setField('${it.id}','responsavel_id',this.value||null)"><option value="">— selecione —</option>${ST.equipe.map(e=>`<option value="${e.id}" ${st.responsavel_id===e.id?'selected':''}>${esc(e.nome)}${e.funcao?' ('+esc(e.funcao)+')':''}</option>`).join('')}</select></div>
      </div>
      <label style="margin-top:14px">Observação</label>
      <textarea rows="2" ${ro?'disabled':''} placeholder="Anotações, pendências, riscos. Não registre senhas/certificados aqui." onchange="setField('${it.id}','obs',this.value)">${esc(st.obs)}</textarea>
      <div class="frow" style="grid-template-columns:auto 1fr;align-items:center;margin-top:12px">
        <div>${ro?'':`<label style="margin:0 0 6px">Anexar evidência</label><input type="file" onchange="attach('${it.id}',this)">`}</div>
        <div class="att-list" id="att_${iid}">${attHTML(it.id,att,ro)}</div>
      </div>
      ${st.updated_at?`<div class="saveinfo">Atualizado em ${new Date(st.updated_at).toLocaleString('pt-BR')}</div>`:''}
    </div></div>`;}
function attHTML(id,att,ro){if(!att.length)return'<span class="hint">Nenhum anexo.</span>';
  return att.map(a=>`<div class="att-row">📄 <a onclick="dl('${a.storage_path}','${esc(a.nome)}')">${esc(a.nome)}</a><span class="hint">${a.tamanho?(a.tamanho>1e6?(a.tamanho/1e6).toFixed(1)+' MB':(a.tamanho/1e3).toFixed(0)+' KB'):''}</span>${ro?'':`<span class="rm" onclick="rmAtt('${id}','${a.id}','${a.storage_path}')">remover</span>`}</div>`).join('');}
window.tog=id=>$('it_'+id.replace('.','_')).classList.toggle('open');

window.setField=async function(id,f,v){try{
  const{error}=await sb.from('item_status').update({[f]:v,updated_by:ST.profile.id}).eq('item_id',id);
  if(error)throw error;ST.status[id]=ST.status[id]||{item_id:id};ST.status[id][f]=v;ST.status[id].updated_at=new Date().toISOString();
  if(f==='status'){modView($('view'),route.mod);$('it_'+id.replace('.','_')).classList.add('open');renderNav();}
}catch(e){alert('Erro ao salvar: '+e.message);}};

window.attach=async function(id,input){const file=input.files[0];if(!file)return;load(true);
  try{const path=`${id}/${Date.now()}_${file.name}`;
    const{error:ue}=await sb.storage.from('anexos').upload(path,file);if(ue)throw ue;
    const{data,error}=await sb.from('anexo').insert({item_id:id,storage_path:path,nome:file.name,mime:file.type,tamanho:file.size,uploaded_by:ST.profile.id}).select().single();
    if(error)throw error;(ST.anexos[id]=ST.anexos[id]||[]).push(data);
    $('att_'+id.replace('.','_')).innerHTML=attHTML(id,ST.anexos[id],false);input.value='';
  }catch(e){alert('Erro no upload: '+e.message);}finally{load(false);}};
window.dl=async function(path,name){const{data,error}=await sb.storage.from('anexos').createSignedUrl(path,60);
  if(error){alert('Erro: '+error.message);return;}const a=document.createElement('a');a.href=data.signedUrl;a.download=name;a.target='_blank';a.click();};
window.rmAtt=async function(id,aid,path){if(!confirm('Remover anexo?'))return;load(true);
  try{await sb.storage.from('anexos').remove([path]);const{error}=await sb.from('anexo').delete().eq('id',aid);if(error)throw error;
    ST.anexos[id]=(ST.anexos[id]||[]).filter(a=>a.id!==aid);$('att_'+id.replace('.','_')).innerHTML=attHTML(id,ST.anexos[id],false);
  }catch(e){alert('Erro: '+e.message);}finally{load(false);}};

/* ---------- cadastros ---------- */
function people(b,type){const cfg=type==='diretoria'?{t:'Diretoria',sub:'Membros que homologam a passagem',f:'cargo',l:'Cargo'}:{t:'Equipe',sub:'Funcionários da área',f:'funcao',l:'Função'};
  setTitle(cfg.t,cfg.sub);const list=ST[type];
  b.innerHTML=`<div class="card"><div class="form-inline">
    <div><label>Nome</label><input id="np_nome" placeholder="Nome completo"></div>
    <div><label>${cfg.l}</label><input id="np_2" placeholder="${cfg.l}"></div>
    <div><label>E-mail</label><input id="np_email" placeholder="email@empresa.com"></div>
    <button class="btn emerald" onclick="addPerson('${type}','${cfg.f}')">Adicionar</button></div>
    ${list.length?`<table><thead><tr><th>Nome</th><th>${cfg.l}</th><th>E-mail</th><th></th></tr></thead><tbody>${list.map(x=>`<tr><td>${esc(x.nome)}</td><td>${esc(x[cfg.f])||'—'}</td><td>${esc(x.email)||'—'}</td><td style="text-align:right"><button class="btn sm danger ghost" onclick="delPerson('${type}','${x.id}')">Excluir</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum cadastro.</div>'}</div>`;}
window.addPerson=async function(type,f){const nome=$('np_nome').value.trim();if(!nome)return alert('Informe o nome.');load(true);
  try{const row={nome,[f]:$('np_2').value.trim()||null,email:$('np_email').value.trim()||null};
    const{data,error}=await sb.from(type).insert(row).select().single();if(error)throw error;ST[type].push(data);people($('view'),type);
  }catch(e){alert('Erro: '+e.message);}finally{load(false);}};
window.delPerson=async function(type,id){if(!confirm('Excluir?'))return;const{error}=await sb.from(type).delete().eq('id',id);
  if(error)return alert(error.message);ST[type]=ST[type].filter(x=>x.id!==id);people($('view'),type);};

function gestores(b){setTitle('Gestores da transição','Gestor que sai e gestor que assume');
  b.innerHTML=`<div class="grid g2">${gcard('anterior','Gestor anterior (que sai)')}${gcard('novo','Novo gestor (que assume)')}</div>`;}
function gcard(tipo,title){const g=ST.gestores[tipo]||{};
  return `<div class="card"><div class="sh"><h2 style="font-size:17px">${title}</h2></div>
    <label>Nome</label><input id="g_${tipo}_nome" value="${esc(g.nome)}" placeholder="Nome completo">
    <label>Cargo</label><input id="g_${tipo}_cargo" value="${esc(g.cargo)}" placeholder="Ex.: Gerente Contábil">
    <label>E-mail</label><input id="g_${tipo}_email" value="${esc(g.email)}" placeholder="email@empresa.com">
    <button class="btn emerald full" onclick="saveGestor('${tipo}')">Salvar</button></div>`;}
window.saveGestor=async function(tipo){const nome=$('g_'+tipo+'_nome').value.trim();if(!nome)return alert('Informe o nome.');load(true);
  try{const row={tipo,nome,cargo:$('g_'+tipo+'_cargo').value.trim()||null,email:$('g_'+tipo+'_email').value.trim()||null};
    const{error}=await sb.from('gestor').upsert(row);if(error)throw error;ST.gestores[tipo]=row;alert('Salvo.');
  }catch(e){alert('Erro: '+e.message);}finally{load(false);}};

function carteiras(b){setTitle('Carteiras de clientes','Carteiras que o novo gestor irá assumir');const list=ST.carteiras;
  b.innerHTML=`<div class="card"><div class="form-inline">
    <div><label>Nome da carteira</label><input id="ct_nome" placeholder="Ex.: Carteira Centro-Oeste"></div>
    <div><label>Descrição / clientes</label><input id="ct_desc" placeholder="Clientes ou segmento"></div>
    <div><label>Responsável</label><select id="ct_resp"><option value="">— equipe —</option>${ST.equipe.map(e=>`<option value="${e.id}">${esc(e.nome)}</option>`).join('')}</select></div>
    <button class="btn emerald" onclick="addCarteira()">Adicionar</button></div>
    ${list.length?`<table><thead><tr><th>Carteira</th><th>Descrição</th><th>Responsável</th><th></th></tr></thead><tbody>${list.map(c=>{const r=ST.equipe.find(e=>e.id===c.responsavel_id);return `<tr><td><b>${esc(c.nome)}</b></td><td>${esc(c.descricao)||'—'}</td><td>${r?esc(r.nome):'—'}</td><td style="text-align:right"><button class="btn sm danger ghost" onclick="delCarteira('${c.id}')">Excluir</button></td></tr>`;}).join('')}</tbody></table>`:'<div class="empty">Nenhuma carteira.</div>'}</div>`;}
window.addCarteira=async function(){const nome=$('ct_nome').value.trim();if(!nome)return alert('Informe o nome.');load(true);
  try{const row={nome,descricao:$('ct_desc').value.trim()||null,responsavel_id:$('ct_resp').value||null};
    const{data,error}=await sb.from('carteira').insert(row).select().single();if(error)throw error;ST.carteiras.push(data);carteiras($('view'));
  }catch(e){alert('Erro: '+e.message);}finally{load(false);}};
window.delCarteira=async function(id){if(!confirm('Excluir?'))return;const{error}=await sb.from('carteira').delete().eq('id',id);
  if(error)return alert(error.message);ST.carteiras=ST.carteiras.filter(c=>c.id!==id);carteiras($('view'));};

/* ---------- usuários ---------- */
async function users(b){setTitle('Usuários e acessos','Defina perfil e módulos de cada pessoa');load(true);
  const[{data:profs},{data:acc}]=await Promise.all([sb.from('profiles').select('*').order('nome'),sb.from('acesso_modulo').select('*')]);
  load(false);const accBy={};(acc||[]).forEach(a=>{(accBy[a.profile_id]=accBy[a.profile_id]||[]).push(a.modulo_key);});
  b.innerHTML=`<div class="warn"><svg viewBox="0 0 24 24"><path d="M12 9v4 M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
    Contas são criadas pelo próprio usuário (tela "Criar conta") ou por convite no painel do Supabase (Authentication › Users). Aqui você define o <b>perfil</b> e libera <b>módulos</b>.</div>
   <div class="card"><table><thead><tr><th>Usuário</th><th>Perfil</th><th>Módulos (perfil "membro")</th></tr></thead><tbody>
   ${(profs||[]).map(u=>`<tr>
     <td><b>${esc(u.nome)}</b><div class="hint">${esc(u.email)||''}</div></td>
     <td><select onchange="setRole('${u.id}',this.value)">${['membro','gestor','diretoria','admin'].map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${roleName(r)}</option>`).join('')}</select></td>
     <td>${u.role!=='membro'?'<span class="tag">Todos os módulos</span>':ST.modules.map(m=>`<span class="tag ${(accBy[u.id]||[]).includes(m.key)?'':'off'}" onclick="toggleAcc('${u.id}','${m.key}',this)">${esc(m.nome)}</span>`).join('')}</td>
   </tr>`).join('')}
   </tbody></table><div class="hint">Clique nos módulos para ligar/desligar o acesso do membro.</div></div>`;}
window.setRole=async function(id,role){const{error}=await sb.from('profiles').update({role}).eq('id',id);
  if(error)return alert(error.message);users($('view'));};
window.toggleAcc=async function(pid,key,el){const on=!el.classList.contains('off');
  if(on){const{error}=await sb.from('acesso_modulo').delete().match({profile_id:pid,modulo_key:key});if(error)return alert(error.message);el.classList.add('off');}
  else{const{error}=await sb.from('acesso_modulo').insert({profile_id:pid,modulo_key:key});if(error)return alert(error.message);el.classList.remove('off');}};

boot();
</script>
</body>
</html>
